<!DOCTYPE html>
<html>
    <body>
        <style>
            div {
                text-align: center;
                background-color: rgb(168, 150, 209);
                padding: 50px;
                border: 10px double #120030;
            }
        </style>
        <div>
<h1>Book Recommendation</h1>

<p>Enter your name:</p>
<input id="name">

<p>Choose a genre:</p>

<select id="genre">
    <option value="fantasy">Fantasy</option>
    <option value="romance">Romance</option>
    <option value="horror">Horror</option>
</select>

<br><br>

<button onclick="pickBook()">Pick My Book</button>

<p id="result"></p>

<script>

let book = {
    title: "Harry Potter",
    genre: "Fantasy",
    publication: 1997
};

function getBook(genre) {
    if (genre == "fantasy") {
        return "Harry Potter";
    } else if (genre == "romance") {
        return "The Notebook";
    } else if (genre == "horror") {
        return "It";
    } else {
        return "Unknown Genre";
    }
}

function makeMessage(name, book) {
    return name.toUpperCase() + ", your book is ... " + book + "!";
}

function pickBook() {
    let name = document.getElementById("name").value;
    let genre = document.getElementById("genre").value;

    let bookChoice = getBook(genre);
    let message = makeMessage(name, bookChoice);

    document.getElementById("result").innerHTML = message;
}

</script>

</body>

</html>

<!DOCTYPE html>
<html>

<body>

<h2>JavaScript: Variables</h2>

<script>

var name = "Aaliyah";

{
    let age = 24;
    console.log(age);
}

let x = 10;

console.log(x + y);

console.log(x / y);

let favoriteColor = "Green";
console.log(favoriteColor);

    name: "Aaliyah",
    age: 24
};

console.log(person);

console.log(name);

</script>

</body>

</html>
